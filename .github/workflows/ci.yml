name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff / pyright / pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Prepare test config
        working-directory: .
        run: |
          mkdir -p apps/backend/var
          cp config/project.template.json config/project.json
          cp config/user.project.template.json config/user.project.json
          python - <<'PY'
          import json
          path = "config/user.project.json"
          data = json.load(open(path))
          data["llm"]["apiKey"] = "sk-ci-test"
          json.dump(data, open(path, "w"))
          PY
      - name: Ruff
        run: uv run ruff check .
      - name: Pyright
        run: uv run pyright
      - name: Error catalog sync check
        run: |
          uv run python scripts/sync_error_catalog.py
          git diff --exit-code -- ../../packages/api-contracts/src/generated/error-catalog.json
      - name: Pytest (offline regression)
        run: uv run pytest -m "not local_config"
      - name: Evaluation helper tests
        run: uv run pytest tests/aiops_evaluation.py tests/rag_evaluation.py -q

  frontend:
    name: Frontend (typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run frontend:typecheck
      - name: Test
        run: npm run frontend:test
      - name: Build
        run: npm run frontend:build

  contracts:
    name: Contracts (typecheck / test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run contracts:typecheck
      - name: Test
        run: npm --workspace packages/api-contracts run test
