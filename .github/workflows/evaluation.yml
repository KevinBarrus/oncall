name: RAG Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  evaluate:
    name: Multi-strategy RAG evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        working-directory: apps/backend
        run: uv sync
      - name: Start Milvus infrastructure
        run: docker compose -f infra/compose.yaml up -d --wait milvus
      - name: Run evaluation
        working-directory: apps/backend
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run python tests/ragas_evaluation.py --limit 5
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-evaluation-report
          path: apps/backend/tests/data/eval_results/eval_latest.json
          if-no-files-found: ignore
